<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Project image placeholder</title>
  <desc id="desc">A placeholder indicating that a verified project screenshot should be added.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14243a"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#79a7ff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <rect width="1440" height="810" fill="url(#grid)"/>
  <rect x="420" y="250" width="600" height="310" rx="36" fill="#0f1b2e" stroke="#79a7ff" stroke-opacity=".35" stroke-width="2"/>
  <path d="M630 435l78-86 74 69 52-47 116 116H490l140-152Z" fill="none" stroke="#55e3ac" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="850" cy="340" r="24" fill="none" stroke="#79a7ff" stroke-width="8"/>
  <text x="720" y="635" fill="#a9c7ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="5">IMAGE SLOT</text>
  <text x="720" y="680" fill="#8fa3bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle">Replace with a verified project screenshot</text>
</svg>
